# Anmo 本地/集成 compose —— SQLite 版（2026-09-28 起，MySQL 容器已移除）。
# 开发日常：后端 `go run ./cmd/anmo`（ANMO_DB_PATH 指向本地文件）；
# 此文件用于容器形态的自测与演示部署，数据与备份都是宿主机目录挂载。
services:
  server:
    build: ./server
    image: anmo-server:sqlite
    container_name: anmo-server
    environment:
      ANMO_SERVER_ADDR: ":8080"
      ANMO_DB_PATH: "/data/anmo.db"
      # F16：JWT secret 必须 ≥32 位随机值（启动时校验，占位符直接拒绝）。
      # 这里的值仅为本仓库演示形态生成的随机数；生产部署必须另行生成：
      #   openssl rand -hex 32
      ANMO_AUTH_JWT_SECRET: "e0db503d9cbe53d09c1e26161664464dc137e507605d87b90fe4435f991d3cfc"
      ANMO_AUTH_ADMIN_PHONE: "13800000000"
      ANMO_AUTH_ADMIN_PASSWORD_SEED: "anmo-admin-2026"
      # F1：短信登录已下线，默认关闭（默认安全）；本地联调需要时显式改 dev。
      ANMO_SMS_MODE: "off"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data          # SQLite 主文件 + WAL/SHM 伴生文件
      - ./backups:/backups    # 定时快照（scripts/backup-sqlite.sh）
    ports:
      - "8080:8080"
    restart: unless-stopped
    # F14：健康检查打穿到数据库（/healthz 内部执行 SELECT 1），
    # 进程活着但库不可用时容器状态必须能看出来。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 防止 json-file 日志无限增长拖垮宿主机磁盘（运维防线）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
