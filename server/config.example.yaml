server:
  addr: ":8080"

database:
  # SQLite 数据文件路径（2026-09-28 起，MySQL 已退役）。
  # WAL 模式会产生 -wal/-shm 伴生文件；部署时把整个目录挂卷并纳入备份。
  path: "data/anmo.db"

auth:
  jwt_secret: "change-me-in-production"
  admin_token_hours: 12
  customer_token_hours: 168
  admin_phone: "13800000000"
  admin_password_seed: "anmo-admin-2026"   # 首次启动时种子 OWNER 账号的初始密码

sms:
  mode: "dev"          # dev: 固定验证码 123456，写入日志
  code_ttl_seconds: 300

log:
  level: "info"

business:
  open_time: "09:00"
  close_time: "20:00"
  slot_minutes: 30
  slot_capacity: 1
  book_ahead_days: 30
  book_min_ahead_hours: 2
  cancel_min_ahead_hours: 2
  buffer_minutes: 0
  low_balance_count: 2
  dormant_days: 60
  expiring_days: 7
